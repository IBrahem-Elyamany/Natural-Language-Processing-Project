services:

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/code
      - chroma_data:/data/chroma
    environment:
      - CHROMA_PERSIST_DIR=/data/chroma
      - OLLAMA_BASE_URL=http://ollama:11434

  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - FASTAPI_BASE_URL=http://backend:8000

volumes:
  chroma_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/chroma_data/my_vector_db
  ollama_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./volumes/ollama_data
